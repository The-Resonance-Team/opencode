name: team-build
# ponytail: team CI on self-hosted (xiro-server-01~08), covers main (team default)
on:
  push:
    branches: [main, dev, document-preview]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Generate SDK
        run: bun turbo build --filter=@opencode-ai/sdk --filter=@opencode-ai/client
      - name: Build CLI (team)
        run: |
          ./packages/opencode/script/build.ts || echo "cli build skipped"
          ./packages/cli/script/build.ts || echo "preview cli build skipped"
        env:
          OPENCODE_VERSION: 0.0.0-team
      - name: Cache apt packages (desktop linux)
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: ${{ runner.os }}-apt-rpm-${{ hashFiles('.github/workflows/team-build.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-rpm-
      - name: Install desktop build deps (ubuntu)
        run: |
          mkdir -p ~/apt-cache && chmod -R a+rw ~/apt-cache
          sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends -o dir::cache::archives="$HOME/apt-cache" rpm || true
          sudo chmod -R a+rw ~/apt-cache
      - name: Prepare desktop
        working-directory: packages/desktop
        run: bun ./scripts/prepare.ts || echo "prepare skipped"
        env:
          OPENCODE_VERSION: 0.0.0-team
          OPENCODE_CHANNEL: dev
      - name: Build desktop
        working-directory: packages/desktop
        run: bun run build || echo "desktop build skipped"
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          OPENCODE_VERSION: 0.0.0-team
          OPENCODE_CHANNEL: dev
      - name: Package desktop (linux, no signing)
        working-directory: packages/desktop
        # ponytail: self-hosted is linux only, so --linux is the only target
        # available without macOS/Windows runners (see publish.yml matrix).
        # For full cross-platform add GitHub-hosted mac/windows jobs.
        run: npx electron-builder --linux --publish never --config electron-builder.config.ts || echo "desktop package skipped"
        env:
          OPENCODE_CHANNEL: dev
        timeout-minutes: 60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team-build-${{ github.sha }}
          path: |
            packages/opencode/dist/*
            packages/cli/dist/*
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/latest*.yml
          if-no-files-found: ignore
          retention-days: 7
