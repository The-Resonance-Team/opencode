name: team-release
# ponytail: team-owned release on self-hosted (xiro-server-01~08), no signing, build + gh release on tag
on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (e.g. 1.2.3-team.1)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=0.0.0-team.${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi
          # channel prod for tags or manual version (team releases are prod), dev otherwise
          if [[ "$GITHUB_REF" == refs/tags/v* ]] || [ -n "${{ inputs.version }}" ]; then
            echo "channel=prod" >> $GITHUB_OUTPUT
          else
            echo "channel=dev" >> $GITHUB_OUTPUT
          fi
      - name: Generate SDK
        run: bun turbo build --filter=@opencode-ai/sdk --filter=@opencode-ai/client
      - name: Build CLI
        run: |
          ./packages/opencode/script/build.ts || true
          ./packages/cli/script/build.ts || true
        env:
          OPENCODE_VERSION: ${{ steps.ver.outputs.version }}
      - name: Cache apt packages (desktop linux)
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: ${{ runner.os }}-apt-rpm-${{ hashFiles('.github/workflows/team-release.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-rpm-
      - name: Install desktop build deps (ubuntu)
        # ponytail: self-hosted runners share /var/lib/apt/lists, concurrent
        # apt-get update would hit "Could not get lock" → retry with backoff.
        run: |
          mkdir -p ~/apt-cache && chmod -R a+rw ~/apt-cache || true
          for i in 1 2 3 4 5; do
            sudo apt-get update -qq && break
            echo "apt-get update lock held, retry $i/5"
            sleep $((i*5))
          done || true
          for i in 1 2 3 4 5; do
            sudo apt-get install -y --no-install-recommends -o dir::cache::archives="$HOME/apt-cache" rpm && break
            echo "apt-get install lock held, retry $i/5"
            sleep $((i*5))
          done || true
          sudo chmod -R a+rw ~/apt-cache || true
      - name: Prepare desktop
        working-directory: packages/desktop
        run: bun ./scripts/prepare.ts
        env:
          OPENCODE_VERSION: ${{ steps.ver.outputs.version }}
          OPENCODE_CHANNEL: ${{ steps.ver.outputs.channel }}
      - name: Build desktop
        working-directory: packages/desktop
        run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          OPENCODE_VERSION: ${{ steps.ver.outputs.version }}
          OPENCODE_CHANNEL: ${{ steps.ver.outputs.channel }}
      - name: Package desktop (linux, no signing)
        working-directory: packages/desktop
        # ponytail: self-hosted is linux only, so only --linux is possible without
        # macOS/Windows runners. Artifacts are co-installable thanks to
        # ai.opencode-resonance.desktop appId (electron-builder.config.ts).
        # For full cross-platform (mac dmg, win exe) add a matrix job like
        # publish.yml build-electron or use GitHub-hosted runners per OS.
        run: npx electron-builder --linux --publish never --config electron-builder.config.ts
        env:
          OPENCODE_CHANNEL: ${{ steps.ver.outputs.channel }}
        timeout-minutes: 60
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          # ponytail: gh release upload cannot handle directories (dist/* are dirs
          # like opencode-linux-x64/bin/opencode). Collect only files.
          mapfile -t cli_files < <(find packages/opencode/dist packages/cli/dist -type f 2>/dev/null || true)
          mapfile -t desktop_files < <(find packages/desktop/dist -maxdepth 1 -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o -name "latest*.yml" -o -name "*.blockmap" \) 2>/dev/null || true)
          all_files=("${cli_files[@]}" "${desktop_files[@]}")
          echo "Found ${#cli_files[@]} CLI files, ${#desktop_files[@]} desktop files"
          printf '  %s\n' "${all_files[@]}" | head -n 30
          tag="v${{ steps.ver.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists, uploading assets"
            if (( ${#all_files[@]} )); then
              gh release upload "$tag" "${all_files[@]}" --clobber
            fi
          else
            if (( ${#all_files[@]} )); then
              gh release create "$tag" --title "$tag (team)" --generate-notes "${all_files[@]}"
            else
              gh release create "$tag" --title "$tag (team)" --generate-notes
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: team-release-${{ steps.ver.outputs.version }}
          path: |
            packages/opencode/dist/*
            packages/cli/dist/*
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/latest*.yml
          if-no-files-found: ignore
          retention-days: 30
